{% if messages %}
  <div class="mb-6 space-y-2">
    {% for message in messages %}
      <div class="rounded-lg px-4 py-3 text-sm font-medium
        {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
        {% elif message.tags == 'success' %}bg-green-50 text-green-700 border border-green-200
        {% elif message.tags == 'warning' %}bg-amber-50 text-amber-700 border border-amber-200
        {% else %}bg-brand-50 text-brand-700 border border-brand-200{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
